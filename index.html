<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Lefty Controller Configurator</title>
  <script>
    const targetUrl = "webui/" + window.location.search + window.location.hash;
    window.location.replace(targetUrl);
  </script>
</head>
<body style="background-color: #121418; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
  <p><a id="redirectLink" href="webui/" style="color: #3b82f6; text-decoration: none; font-size: 1.1rem;">WebUI 設定ツールへ移動中... (自動で切り替わらない場合はこちらをクリック)</a></p>
  <script>
    const link = document.getElementById("redirectLink");
    if (link) link.href = "webui/" + window.location.search + window.location.hash;
  </script>
</body>
</html>
